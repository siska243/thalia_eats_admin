; Reglages applicatifs. Les envois d'images passent par Filament, dont les
; televersements depassent regulierement les 2 Mo par defaut de PHP.
upload_max_filesize = 32M
post_max_size = 36M
memory_limit = 512M
max_execution_time = 120

; L'application ecrit ses erreurs dans les journaux du conteneur, jamais dans
; la reponse HTTP : une trace renvoyee au client fuite des chemins et des
; requetes.
display_errors = Off
log_errors = On
error_log = /dev/stderr

opcache.enable = 1
opcache.memory_consumption = 192
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0

; PHP2Shell (CVE-2026-109618 / CVE-2026-109619, 21 octobre 2026) : le suivi de
; televersement est le vecteur par defaut des deux RCE. L'application ne s'en
; sert pas — Filament lit la progression cote navigateur.
session.upload_progress.enabled = 0
