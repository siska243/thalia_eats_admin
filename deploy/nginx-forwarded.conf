# Traduit l'en-tete d'Apache en variables serveur que PHP comprend.
#
# TrustProxies de l'application a $proxies a null : Laravel n'accorde donc
# aucune confiance a X-Forwarded-Proto, et derriere le TLS d'Apache il
# construirait toutes ses URL en http://. Consequences concretes : les liens
# de paiement signes deviennent invalides une fois ouverts en https, et
# l'administration Filament sert ses assets en contenu mixte.
#
# Le corriger cote application demanderait de modifier
# app/Http/Middleware/TrustProxies.php, un fichier versionne. On le traite ici
# a la place : nginx renseigne HTTPS et SERVER_PORT, que Symfony lit avant
# toute notion de proxy. Le correctif reste ainsi dans la configuration de
# deploiement, la ou il appartient.
#
# Cette traduction n'est sure que parce que le conteneur n'ecoute pas
# publiquement : seul Apache, sur 127.0.0.1, peut poser cet en-tete.

map $http_x_forwarded_proto $thalia_https {
    default   off;
    https     on;
}

map $http_x_forwarded_proto $thalia_server_port {
    default   8080;
    https     443;
}

# ─────────────────────────────────────────────────────────────────────────────
# L'adresse reelle du client.
#
# TrustProxies de l'application a $proxies a null : Laravel ignore donc
# completement X-Forwarded-For, et $request->ip() renvoyait l'adresse de la
# passerelle Docker — LA MEME POUR TOUS LES CLIENTS.
#
# Ce n'etait pas un detail d'journalisation. Les limiteurs de debit comptes par
# IP (« lien-paiement », et « api » pour le trafic non authentifie) partageaient
# alors un seul compteur pour la planete entiere : un seul visiteur un peu
# rapide faisait refuser les liens de paiement de TOUS les autres, et aucune
# protection par adresse n'existait reellement.
#
# On le corrige ici plutot que dans TrustProxies, pour la meme raison que le
# bloc ci-dessus : c'est un fait de deploiement, pas une regle applicative.
# real_ip reecrit $remote_addr avant fastcgi_params, donc REMOTE_ADDR arrive
# juste a PHP sans que l'application ait a faire confiance a quoi que ce soit.
#
# Qui a le droit de renseigner cet en-tete : uniquement les reseaux prives,
# c'est-a-dire la passerelle Docker par laquelle Apache arrive. Le conteneur
# n'ecoute que sur 127.0.0.1 cote hote : personne d'autre ne peut l'atteindre.
# Et le vhost Apache retire tout X-Forwarded-For entrant avant de poser le
# sien, donc son contenu ne vient jamais du client.
#
# real_ip_recursive off : on prend la derniere adresse de la liste, celle
# qu'Apache a ecrite lui-meme, jamais une que le client aurait glissee devant.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
set_real_ip_from 127.0.0.1;
real_ip_header X-Forwarded-For;
real_ip_recursive off;
