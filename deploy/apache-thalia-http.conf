# Vhost a activer MAINTENANT. Port 80 uniquement, aucune directive SSL.
#
# C'est volontaire, et c'est le point important sur cette machine.
#
# Un vhost qui declare SSLCertificateFile vers un fichier absent fait echouer
# `apache2ctl configtest`. Un `reload` refuse alors de s'appliquer — sans
# degat — mais un `restart` empeche Apache de demarrer, et ce sont TOUTES les
# applications du serveur qui tombent, pas seulement celle-ci.
#
# L'ordre sur : ce fichier d'abord, puis `certbot --apache`, qui ecrit
# lui-meme le vhost 443 avec les bons chemins et ajoute la redirection. On ne
# redige donc aucune configuration TLS a la main.
#
# Tant que le DNS de app.thaliaeats.com ne designe pas ce serveur, ce vhost
# est inerte : aucun trafic ne porte ce nom d'hote. Il ne peut donc rien
# casser de ce qui tourne deja.
#
# Modules requis (une seule fois) :
#   sudo a2enmod proxy proxy_http headers remoteip

<VirtualHost *:80>
    # A remplacer par le sous-domaine de recette si vous suivez l'option B,
    # par exemple api.thaliaeats.com.
    ServerName app.thaliaeats.com

    ProxyPreserveHost On
    ProxyTimeout 120

    # Sans ces en-tetes, Laravel construit ses URL en http:// et journalise
    # l'IP d'Apache au lieu de celle du client : les liens de paiement
    # partiraient en clair, et le limiteur de debit compterait tout le trafic
    # sur une seule adresse.
    #
    # X-Forwarded-Proto reste "http" ici : certbot le passera a "https" en
    # creant le vhost 443. C'est nginx, dans le conteneur, qui traduit cet
    # en-tete en variables serveur (voir nginx-forwarded.conf).
    RequestHeader set X-Forwarded-Proto "http"
    RemoteIPHeader X-Forwarded-For

    # Les televersements Filament vont jusqu'a 32 Mo (voir php.ini).
    LimitRequestBody 37748736

    # Le port doit correspondre a APP_PORT de deploy/.env.
    ProxyPass        / http://127.0.0.1:8096/
    ProxyPassReverse / http://127.0.0.1:8096/

    ErrorLog  ${APACHE_LOG_DIR}/thalia-eats-error.log
    CustomLog ${APACHE_LOG_DIR}/thalia-eats-access.log combined
</VirtualHost>
