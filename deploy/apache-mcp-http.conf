# Connecteur MCP — vhost a activer en PORT 80 UNIQUEMENT, aucune directive SSL.
#
# Meme raison que pour apache-thalia-http.conf, et elle vaut d'etre repetee :
# un SSLCertificateFile pointant vers un fichier absent fait echouer
# `apache2ctl configtest`. Un `reload` refuse alors de s'appliquer, sans degat,
# mais un `restart` empeche Apache de demarrer — et ce sont TOUTES les
# applications de ce serveur qui tombent, pas seulement celle-ci.
#
# L'ordre : ce fichier d'abord, puis `certbot --apache -d mcp.thaliaeats.com`,
# qui ecrit lui-meme le vhost 443 avec les bons chemins et ajoute la
# redirection. Aucune configuration TLS n'est redigee a la main.
#
# Le DNS de mcp.thaliaeats.com doit designer ce serveur avant certbot, sinon
# la validation echoue. Tant que ce n'est pas le cas, ce vhost est inerte :
# aucun trafic ne porte ce nom d'hote, il ne peut rien casser.
#
# Modules requis (une seule fois) :
#   sudo a2enmod proxy proxy_http headers

<VirtualHost *:80>
    ServerName mcp.thaliaeats.com

    # Le connecteur possede une liste blanche d'hotes
    # (THALIA_MCP_HOTES_AUTORISES, contre le DNS rebinding). Sans
    # ProxyPreserveHost il recevrait « 127.0.0.1:8097 » comme Host, et cette
    # liste ne protegerait plus rien.
    ProxyPreserveHost On

    # Le transport MCP « streamable HTTP » garde un flux SSE ouvert pendant
    # toute la conversation. Un delai court la couperait au milieu d'une
    # reponse, et le client verrait une erreur reseau incomprehensible.
    ProxyTimeout 120

    # mod_deflate met un flux SSE EN TAMPON : le client ne recoit rien avant la
    # fin de la reponse, donc la session parait gelee sans qu'aucune erreur ne
    # soit levee. Les reponses du connecteur sont de petits JSON-RPC — la
    # compression n'y gagne rien. On la coupe entierement plutot que de
    # dependre d'une regle conditionnelle sur l'en-tete Accept.
    SetEnv no-gzip 1

    # Meme raison que sur le vhost du backend : mod_proxy AJOUTE a la suite de
    # ce que le client envoie. On retire d'abord, il repose ensuite l'adresse
    # TCP reelle. Et pas de RemoteIPHeader : sans RemoteIPTrustedProxy il ferait
    # confiance a n'importe quel emetteur, et Apache est ici en frontal.
    RequestHeader unset X-Forwarded-For

    # Pas de LimitRequestBody eleve : le connecteur n'accepte que du JSON-RPC,
    # quelques kilo-octets. Aucun televersement ne passe par ici.

    # Le port doit correspondre a MCP_PORT de deploy/.env.
    ProxyPass        / http://127.0.0.1:8097/
    ProxyPassReverse / http://127.0.0.1:8097/

    ErrorLog  ${APACHE_LOG_DIR}/thalia-mcp-error.log
    CustomLog ${APACHE_LOG_DIR}/thalia-mcp-access.log combined
</VirtualHost>
