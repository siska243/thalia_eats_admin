[program:php-fpm]
command=php-fpm --nodaemonize --fpm-config /usr/local/etc/php-fpm.conf
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=10

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=20

# Planificateur Laravel.
#
# Sans lui, tout ce qui est declare dans app/Console/Kernel.php ne s'execute
# jamais en production — notamment l'annulation des commandes abandonnees, qui
# debloque les clients coinces par une commande qui n'avance plus.
#
# `schedule:work` plutot qu'une entree cron appelant `schedule:run` : le
# conteneur n'a pas de demon cron, et cette commande tourne au premier plan,
# ce qui est exactement ce que supervisord sait surveiller et relancer.
[program:scheduler]
command=php /var/www/html/artisan schedule:work
# Sous le meme compte que php-fpm : lance en root, le planificateur creerait
# dans storage/ des journaux et des caches appartenant a root, que php-fpm ne
# pourrait plus ecrire ensuite.
user=www-data
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=30
