server {
    listen 8080 default_server;
    server_name _;

    root /var/www/html/public;
    index index.php;

    charset utf-8;
    client_max_body_size 36M;

    # Les images televersees vivent dans public/images (disque
    # « uploads_image »), servies directement par nginx sans passer par PHP.
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Sonde de sante servie par nginx seul. Ce squelette est celui de Laravel
    # 10 : il n'a pas la route /up des versions suivantes, et aucune route
    # applicative ne repond 200 sans authentification.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        include fastcgi_params;

        # Doivent venir APRES l'include : fastcgi_params fixe HTTPS et
        # SERVER_PORT, il faut donc les redefinir ensuite pour que la valeur
        # transmise par Apache l'emporte.
        fastcgi_param HTTPS $thalia_https;
        fastcgi_param SERVER_PORT $thalia_server_port;
        fastcgi_read_timeout 120;
        fastcgi_buffers 16 32k;
        fastcgi_buffer_size 64k;
    }

    # Un .php cache derriere un chemin de televersement ne doit pas etre
    # interprete.
    location ~ /\.(?!well-known).* { deny all; }

    access_log /dev/stdout;
    error_log /dev/stderr;
}
